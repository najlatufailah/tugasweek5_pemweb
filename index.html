<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker Kuliah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h2 class="todo-subtitle-top">TUGAS NAJLA✦</h2>
        <h1 class="todo-title">Task Tracker Kuliah</h1>
        <p class="todo-desc">Harus Produktif? ✨</p>

        <!-- Form Tambah Tugas dengan event submit -->
        <form id="taskForm" class="task-form">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Judul tugas (min. 3 karakter)" autocomplete="off">
            </div>
            <div class="input-row">
                <select id="matkulInput">
                    <option value="Pemrograman Web">Pemrograman Web</option>
                    <option value="Basis Data">Basis Data</option>
                    <option value="Struktur Data">Struktur Data</option>
                    <option value="Jaringan Komputer">Jaringan Komputer</option>
                </select>
                <input type="date" id="deadlineInput">
                <button type="submit" id="addBtn">+ Tambah</button>
            </div>
            <!-- Pesan Error Validasi -->
            <p id="errorMsg" class="error-msg"></p>
        </form>

        <!-- Tombol filter task -->
        <div class="filter-buttons">
            <button type="button" class="filter-btn on" data-filter="all">Semua</button>
            <button type="button" class="filter-btn" data-filter="active">Aktif</button>
            <button type="button" class="filter-btn" data-filter="completed">Selesai</button>
        </div>

        <!-- Counter Tugas Aktif -->
        <div id="taskCounter" class="task-counter">0 tugas aktif</div>

        <!-- Daftar Task -->
        <ul id="taskList" class="task-list"></ul>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
